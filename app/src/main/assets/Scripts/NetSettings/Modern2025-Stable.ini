// Stable profile for modern Wi-Fi/LAN with cross-architecture clients.
// Prioritizes deterministic sync over aggressive client-side prediction.

cli_bAutoAdjustSettings = 0;
cli_bPrediction = 0;
cli_iBufferActions = 1;

// Keep enough budget for modern links without forcing modem-era throttling.
cli_iMinBPS = 15000;
cli_iMaxBPS = 200000;

// Explicitly disable artificial packet loss and keep deterministic timer mode.
net_fDropPackets = 0;
net_iExactTimer = 2;

// Sync diagnostics (client-side log to Temp\syncdiag_client_*.log).
net_bSyncDiag = 1;
net_bSyncDiagDumpOnBad = 0;
net_strSyncDiagTag = "android_client";
