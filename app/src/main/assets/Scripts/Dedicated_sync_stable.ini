// Dedicated sync stability profile for mixed-architecture clients (Android ARM + Debian AMD64).
// Include this from Dedicated_startup.ini.

// Do not kick immediately on occasional mismatch while tuning cross-platform determinism.
ser_iKickOnSyncBad = 0;
ser_bDetachOnSyncBad = 0;
ser_bKickOnSyncLate = 0;

// Keep larger sync window and lower sync-check rate to avoid false positives on jitter.
ser_tmSyncCheckFrequency = 2.0;
ser_iSyncCheckBuffer = 180;

// Keep deterministic timer path.
net_iExactTimer = 2;

// Avoid non-reproducible seed randomization at startup.
ser_bBetterRandomOnStart = 0;
ser_bBetterRandomOnLoad = 0;

// Sync diagnostics (server logs + full state dump on SYNCBAD).
net_bSyncDiag = 1;
net_bSyncDiagDumpOnBad = 1;
net_strSyncDiagTag = "debian_server";
